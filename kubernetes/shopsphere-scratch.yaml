apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopsphere-scratch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shopsphere-from-scratch-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18082
          env:
            - name: PORT
              value: "18082"
            - name: UPSTREAM_USERS
              value: "http://user-service:5001"
            - name: UPSTREAM_PRODUCTS
              value: "http://product-service:5002"
            - name: UPSTREAM_ORDERS
              value: "http://order-service:5003"
            - name: UPSTREAM_PAYMENTS
              value: "http://payment-service:5004"
            - name: UPSTREAM_NOTIFICATIONS
              value: "http://notification-service:5005"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 18082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 18082
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopsphere-scratch
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 18082
      targetPort: 18082
