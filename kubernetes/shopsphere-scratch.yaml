apiVersion: v1
kind: Namespace
metadata:
  name: shopsphere-scratch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shopsphere-scratch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: shopsphere-from-scratch-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shopsphere-scratch
spec:
  selector:
    app: user-service
  ports:
    - port: 5001
      targetPort: 5001
---
